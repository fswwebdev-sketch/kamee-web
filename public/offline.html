<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04338B">
<meta name="robots" content="noindex">
<title>Sedang offline — Kamee Coffee</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { --bg:#F4F6FB; --card:#FFFFFF; --ink:#0B1B3F; --muted:#55627E; --primary:#04338B; --cream:#E3EAF7; --line:#DCE3F0; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0A1020; --card:#111A2E; --ink:#E3EAF7; --muted:#BCA898; --primary:#C9A27E; --cream:#1F2D4A; --line:#1F2D4A; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  .card { width: 100%; max-width: 400px; text-align: center; }
  .art { width: 120px; height: 120px; margin: 0 auto 24px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); }
  .actions { display: grid; gap: 12px; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 14px; font: 600 1rem/1 inherit; text-decoration: none; border: 0; cursor: pointer; touch-action: manipulation; }
  .primary { background: var(--primary); color: #fff; }
  @media (prefers-color-scheme: dark) { .primary { color: #0A1020; } }
  .ghost { background: var(--cream); color: var(--ink); }
  .btn:active { transform: scale(.98); }
  .tip { margin-top: 24px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: .875rem; text-align: left; }
  .status { margin-top: 16px; font-size: .8125rem; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="art" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="56" fill="var(--cream)"/>
      <path d="M34 50h44v20a22 22 0 0 1-22 22h0a22 22 0 0 1-22-22z" fill="var(--primary)"/>
      <path d="M78 56h6a9 9 0 0 1 0 18h-7" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round"/>
      <path d="M46 30c-4 5 4 8 0 13M58 28c-4 5 4 8 0 13M70 30c-4 5 4 8 0 13" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <path d="M28 96l64-64" stroke="var(--bg)" stroke-width="9" stroke-linecap="round"/>
      <path d="M28 96l64-64" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>Kamu sedang offline</h1>
    <p>Koneksi internet terputus. Menu yang pernah kamu buka tetap bisa dilihat; untuk memesan dan membayar, sambungkan kembali internetmu.</p>
    <div class="actions">
      <button class="btn primary" id="retry" type="button">Coba lagi</button>
      <a class="btn ghost" href="/menu">Lihat menu tersimpan</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="tip"><strong>Tips:</strong> isi keranjangmu tetap tersimpan di perangkat ini. Begitu online, lanjutkan checkout seperti biasa.</div>
  </div>
</main>
<script>
  var s = document.getElementById("status");
  function go() { s.textContent = "Mencoba menyambung…"; location.reload(); }
  document.getElementById("retry").addEventListener("click", go);
  // Otomatis kembali saat koneksi pulih
  window.addEventListener("online", go);
</script>
</body>
</html>
