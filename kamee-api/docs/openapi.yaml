paths:
  /api/v1/categories:
    get:
      summary: 'Daftar kategori aktif.'
      operationId: daftarKategoriAktif
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Katalog
      security: []
  /api/v1/products:
    get:
      summary: 'Menu produk.'
      operationId: menuProduk
      description: ''
      parameters:
        -
          in: query
          name: search
          description: 'Cari nama produk.'
          example: aren
          required: false
          schema:
            type: string
            description: 'Cari nama produk.'
            example: aren
        -
          in: query
          name: 'filter[category]'
          description: 'Slug kategori.'
          example: coffee
          required: false
          schema:
            type: string
            description: 'Slug kategori.'
            example: coffee
        -
          in: query
          name: 'filter[outlet]'
          description: 'Hanya produk yang tersedia di outlet ini.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Hanya produk yang tersedia di outlet ini.'
            example: 1
        -
          in: query
          name: 'filter[featured]'
          description: 'Produk unggulan.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Produk unggulan.'
            example: true
        -
          in: query
          name: 'filter[best_seller]'
          description: 'Produk terlaris.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Produk terlaris.'
            example: true
        -
          in: query
          name: sort
          description: 'price, -price, -sold_count, -rating, name.'
          example: '-sold_count'
          required: false
          schema:
            type: string
            description: 'price, -price, -sold_count, -rating, name.'
            example: '-sold_count'
        -
          in: query
          name: include
          description: 'images, options, category.'
          example: category
          required: false
          schema:
            type: string
            description: 'images, options, category.'
            example: category
        -
          in: query
          name: page
          description: Halaman.
          example: 1
          required: false
          schema:
            type: integer
            description: Halaman.
            example: 1
        -
          in: query
          name: per_page
          description: 'Maks 50.'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Maks 50.'
            example: 12
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Katalog
      security: []
  '/api/v1/products/{slug}':
    get:
      summary: 'Detail produk + galeri + opsi + ringkasan rating.'
      operationId: detailProduk+Galeri+Opsi+RingkasanRating
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Katalog
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the product.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/products/{product_slug}/reviews':
    get:
      summary: 'Ulasan produk.'
      operationId: ulasanProduk
      description: ''
      parameters:
        -
          in: query
          name: rating
          description: 'Filter bintang (1-5).'
          example: 5
          required: false
          schema:
            type: integer
            description: 'Filter bintang (1-5).'
            example: 5
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Katalog
      security: []
    parameters:
      -
        in: path
        name: product_slug
        description: 'The slug of the product.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/products/{product_slug}/related':
    get:
      summary: 'Produk serupa (kategori sama, terlaris).'
      operationId: produkSerupakategoriSamaTerlaris
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Katalog
      security: []
    parameters:
      -
        in: path
        name: product_slug
        description: 'The slug of the product.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/promotions:
    get:
      summary: 'Promo aktif yang sedang berjalan.'
      operationId: promoAktifYangSedangBerjalan
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Promo
      security: []
  /api/v1/promotions/validate:
    post:
      summary: 'Cek voucher.'
      operationId: cekVoucher
      description: 'Rate limit 10 permintaan/menit. Diskon final tetap dihitung ulang saat membuat pesanan.'
      parameters: []
      responses: {  }
      tags:
        - Promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Kode voucher. :Attribute maksimal 50 karakter.'
                  example: KAMEEHEMAT
                subtotal:
                  type: integer
                  description: 'Subtotal keranjang (rupiah). :Attribute minimal bernilai 0.'
                  example: 56000
                outlet_id:
                  type: integer
                  description: 'ID outlet. Must match an existing stored value.'
                  example: 1
                  nullable: true
                delivery_fee:
                  type: integer
                  description: 'Ongkir (untuk voucher gratis ongkir). :Attribute minimal bernilai 0.'
                  example: 10500
                  nullable: true
              required:
                - code
                - subtotal
      security: []
  /api/v1/outlets:
    get:
      summary: 'Outlet beserta jam buka dan koordinat.'
      operationId: outletBesertaJamBukaDanKoordinat
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - 'Outlet & Pengantaran'
      security: []
  /api/v1/delivery/quote:
    post:
      summary: 'Hitung ongkir.'
      operationId: hitungOngkir
      description: 'Jarak dihitung dengan rumus Haversine dari koordinat outlet. Di luar radius → 422.'
      parameters: []
      responses: {  }
      tags:
        - 'Outlet & Pengantaran'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outlet_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 1
                lat:
                  type: number
                  description: 'Latitude tujuan. :Attribute harus bernilai antara -90 dan 90.'
                  example: -6.178
                lng:
                  type: number
                  description: 'Longitude tujuan. :Attribute harus bernilai antara -180 dan 180.'
                  example: 106.631
              required:
                - outlet_id
                - lat
                - lng
      security: []
  /api/v1/banners:
    get:
      summary: 'Banner aktif.'
      operationId: bannerAktif
      description: ''
      parameters:
        -
          in: query
          name: placement
          description: 'Posisi banner.'
          example: home
          required: false
          schema:
            type: string
            description: 'Posisi banner.'
            example: home
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Konten
      security: []
  /api/v1/contacts:
    post:
      summary: 'Kirim form kontak (dilindungi captcha Turnstile).'
      operationId: kirimFormKontakdilindungiCaptchaTurnstile
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Konten
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ':Attribute maksimal 100 karakter.'
                  example: Dinda
                email:
                  type: string
                  description: ':Attribute harus berupa alamat email yang valid. :Attribute maksimal 150 karakter.'
                  example: dinda@example.com
                phone:
                  type: string
                  description: ''
                  example: '081234567890'
                  nullable: true
                subject:
                  type: string
                  description: ':Attribute maksimal 150 karakter.'
                  example: 'Kerja sama event'
                message:
                  type: string
                  description: ':Attribute maksimal 3000 karakter.'
                  example: 'Halo Kamee, kami ingin memesan 100 cup untuk acara kantor.'
                turnstile_token:
                  type: string
                  description: 'Token Cloudflare Turnstile (wajib di produksi).'
                  example: XXXX.DUMMY.TOKEN
                  nullable: true
              required:
                - name
                - email
                - subject
                - message
      security: []
  /api/v1/testimonials:
    get:
      summary: 'Ulasan unggulan untuk homepage (rating ≥ 4 dengan komentar).'
      operationId: ulasanUnggulanUntukHomepagerating4DenganKomentar
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Konten
      security: []
  /api/v1/blogs:
    get:
      summary: 'Daftar artikel terbit.'
      operationId: daftarArtikelTerbit
      description: ''
      parameters:
        -
          in: query
          name: 'filter[category]'
          description: 'Slug kategori blog.'
          example: tips-kopi
          required: false
          schema:
            type: string
            description: 'Slug kategori blog.'
            example: tips-kopi
        -
          in: query
          name: search
          description: 'Cari judul.'
          example: kopi
          required: false
          schema:
            type: string
            description: 'Cari judul.'
            example: kopi
        -
          in: query
          name: sort
          description: '-published_at, -views.'
          example: '-published_at'
          required: false
          schema:
            type: string
            description: '-published_at, -views.'
            example: '-published_at'
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Blog
      security: []
  '/api/v1/blogs/{slug}':
    get:
      summary: 'Detail artikel + artikel terkait.'
      operationId: detailArtikel+ArtikelTerkait
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Blog
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the blog.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/blog-categories:
    get:
      summary: 'Kategori blog.'
      operationId: kategoriBlog
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Terjadi kesalahan pada server. Silakan coba lagi.'
                properties:
                  message:
                    type: string
                    example: 'Terjadi kesalahan pada server. Silakan coba lagi.'
      tags:
        - Blog
      security: []
  /api/v1/orders/quote:
    post:
      summary: 'Simulasi harga keranjang.'
      operationId: simulasiHargaKeranjang
      description: 'Menghitung total (subtotal, ongkir, promo, poin) tanpa menyimpan pesanan.'
      parameters: []
      responses: {  }
      tags:
        - 'Pesanan & Pembayaran'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outlet_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 1
                customer:
                  type: object
                  description: ''
                  example: []
                  properties:
                    name:
                      type: string
                      description: ':Attribute maksimal 100 karakter.'
                      example: Dinda
                    phone:
                      type: string
                      description: ''
                      example: '6281234567890'
                  required:
                    - name
                    - phone
                fulfillment:
                  type: string
                  description: 'pickup | delivery | dine_in.'
                  example: delivery
                  enum:
                    - pickup
                    - delivery
                    - dine_in
                address:
                  type: object
                  description: ''
                  example: null
                  properties:
                    text:
                      type: string
                      description: ':Attribute maksimal 500 karakter.'
                      example: 'Jl. Merdeka 10'
                      nullable: true
                    lat:
                      type: number
                      description: ':Attribute harus bernilai antara -90 dan 90.'
                      example: -6.178
                      nullable: true
                    lng:
                      type: number
                      description: ':Attribute harus bernilai antara -180 dan 180.'
                      example: 106.631
                      nullable: true
                    note:
                      type: string
                      description: ':Attribute maksimal 200 karakter.'
                      example: 'Pagar hitam'
                      nullable: true
                  nullable: true
                scheduled_at:
                  type: string
                  description: 'Opsional, pesanan terjadwal (ISO 8601). :Attribute bukan tanggal yang valid.'
                  example: null
                  nullable: true
                items:
                  type: array
                  description: 'Daftar item keranjang. :Attribute minimal berisi 1 item. :Attribute maksimal berisi 30 item.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                        description: ''
                        example: 1
                      qty:
                        type: integer
                        description: ':Attribute minimal bernilai 1. :Attribute maksimal bernilai 50.'
                        example: 2
                      option_ids:
                        type: array
                        description: ''
                        example:
                          - 16
                        items:
                          type: integer
                      note:
                        type: string
                        description: ':Attribute maksimal 200 karakter.'
                        example: 'less ice'
                        nullable: true
                    required:
                      - product_id
                      - qty
                promo_code:
                  type: string
                  description: ':Attribute maksimal 50 karakter.'
                  example: KAMEEHEMAT
                  nullable: true
                redeem_points:
                  type: integer
                  description: 'Poin yang ditukar (khusus member login). :Attribute minimal bernilai 0.'
                  example: 0
                  nullable: true
                note:
                  type: string
                  description: ':Attribute maksimal 500 karakter.'
                  example: 'Tolong sedotan kertas'
                  nullable: true
              required:
                - outlet_id
                - customer
                - fulfillment
                - items
      security: []
  /api/v1/orders/whatsapp:
    post:
      summary: 'Pesan via WhatsApp.'
      operationId: pesanViaWhatsApp
      description: 'Menyimpan pesanan berstatus pending (kanal whatsapp) dan mengembalikan tautan wa.me berisi ringkasan pesanan.'
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: 5f0c9f5e-1a2b-4c3d-8e9f-001122334456
          schema:
            type: string
      responses: {  }
      tags:
        - 'Pesanan & Pembayaran'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outlet_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 1
                customer:
                  type: object
                  description: ''
                  example: []
                  properties:
                    name:
                      type: string
                      description: ':Attribute maksimal 100 karakter.'
                      example: Dinda
                    phone:
                      type: string
                      description: ''
                      example: '6281234567890'
                  required:
                    - name
                    - phone
                fulfillment:
                  type: string
                  description: 'pickup | delivery | dine_in.'
                  example: delivery
                  enum:
                    - pickup
                    - delivery
                    - dine_in
                address:
                  type: object
                  description: ''
                  example: null
                  properties:
                    text:
                      type: string
                      description: ':Attribute maksimal 500 karakter.'
                      example: 'Jl. Merdeka 10'
                      nullable: true
                    lat:
                      type: number
                      description: ':Attribute harus bernilai antara -90 dan 90.'
                      example: -6.178
                      nullable: true
                    lng:
                      type: number
                      description: ':Attribute harus bernilai antara -180 dan 180.'
                      example: 106.631
                      nullable: true
                    note:
                      type: string
                      description: ':Attribute maksimal 200 karakter.'
                      example: 'Pagar hitam'
                      nullable: true
                  nullable: true
                scheduled_at:
                  type: string
                  description: 'Opsional, pesanan terjadwal (ISO 8601). :Attribute bukan tanggal yang valid.'
                  example: null
                  nullable: true
                items:
                  type: array
                  description: 'Daftar item keranjang. :Attribute minimal berisi 1 item. :Attribute maksimal berisi 30 item.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                        description: ''
                        example: 1
                      qty:
                        type: integer
                        description: ':Attribute minimal bernilai 1. :Attribute maksimal bernilai 50.'
                        example: 2
                      option_ids:
                        type: array
                        description: ''
                        example:
                          - 16
                        items:
                          type: integer
                      note:
                        type: string
                        description: ':Attribute maksimal 200 karakter.'
                        example: 'less ice'
                        nullable: true
                    required:
                      - product_id
                      - qty
                promo_code:
                  type: string
                  description: ':Attribute maksimal 50 karakter.'
                  example: KAMEEHEMAT
                  nullable: true
                redeem_points:
                  type: integer
                  description: 'Poin yang ditukar (khusus member login). :Attribute minimal bernilai 0.'
                  example: 0
                  nullable: true
                note:
                  type: string
                  description: ':Attribute maksimal 500 karakter.'
                  example: 'Tolong sedotan kertas'
                  nullable: true
              required:
                - outlet_id
                - customer
                - fulfillment
                - items
      security: []
  /api/v1/orders:
    post:
      summary: 'Buat pesanan.'
      operationId: buatPesanan
      description: "Tamu maupun member (kirim Bearer token pelanggan untuk menukar poin). Server menghitung ulang\nseluruh harga, opsi, ongkir, promo, dan poin. Header `Idempotency-Key` wajib."
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: 5f0c9f5e-1a2b-4c3d-8e9f-001122334455
          schema:
            type: string
      responses: {  }
      tags:
        - 'Pesanan & Pembayaran'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outlet_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 1
                customer:
                  type: object
                  description: ''
                  example: []
                  properties:
                    name:
                      type: string
                      description: ':Attribute maksimal 100 karakter.'
                      example: Dinda
                    phone:
                      type: string
                      description: ''
                      example: '6281234567890'
                  required:
                    - name
                    - phone
                fulfillment:
                  type: string
                  description: 'pickup | delivery | dine_in.'
                  example: delivery
                  enum:
                    - pickup
                    - delivery
                    - dine_in
                address:
                  type: object
                  description: ''
                  example: null
                  properties:
                    text:
                      type: string
                      description: ':Attribute maksimal 500 karakter.'
                      example: 'Jl. Merdeka 10'
                      nullable: true
                    lat:
                      type: number
                      description: ':Attribute harus bernilai antara -90 dan 90.'
                      example: -6.178
                      nullable: true
                    lng:
                      type: number
                      description: ':Attribute harus bernilai antara -180 dan 180.'
                      example: 106.631
                      nullable: true
                    note:
                      type: string
                      description: ':Attribute maksimal 200 karakter.'
                      example: 'Pagar hitam'
                      nullable: true
                  nullable: true
